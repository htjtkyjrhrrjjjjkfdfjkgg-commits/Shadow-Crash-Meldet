
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o "ShadowCrashMeldet_Complete_Website_Android(1).zip" -d .
          ls -la ShadowCrashMeldet_Complete_Website_Android/android

      - name: Build APK
        working-directory: ShadowCrashMeldet_Complete_Website_Android/android
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-crash-meldet-debug-apk
          path: ShadowCrashMeldet_Complete_Website_Android/android/app/build/outputs/apk/debug/app-debug.apk
